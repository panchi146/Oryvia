name: Validate Oryvia source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm ci --ignore-scripts
        working-directory: installer-app
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: installer-app
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path installer-app/src-tauri/Cargo.toml
      - run: node --test tests/*.test.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin oryvia
      - run: cargo test --locked --manifest-path installer-app/src-tauri/Cargo.toml
